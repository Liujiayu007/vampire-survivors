<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dark Survivors - 黑夜幸存者</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; }
body {
  background:#0a0a0f; overflow:hidden; font-family:'Segoe UI',sans-serif;
  display:flex; justify-content:center; align-items:center;
}
#game-stage {
  position:relative; flex-shrink:0;
  box-shadow:0 8px 48px rgba(0,0,0,0.55);
  border-radius:4px; overflow:hidden;
  border:1px solid #243b55;
}
canvas { display:block; width:100%; height:100%; }
#ui-overlay {
  position:absolute; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:10;
}
#hud {
  position:absolute; top:12px; left:12px; color:#fff;
  font-size:14px; line-height:1.6; text-shadow:1px 1px 2px #000;
}
#hp-bar-outer {
  width:200px; height:10px; background:#333; border-radius:5px;
  overflow:hidden; margin-top:4px;
}
#hp-bar-inner { width:100%; height:100%; background:#e63946; border-radius:5px; transition:width 0.15s; }
#xp-bar-outer {
  width:100%; height:8px; background:#222; border-radius:4px;
  margin-top:8px; position:relative;
}
#xp-bar-inner { width:0%; height:100%; background:#4895ef; border-radius:4px; transition:width 0.15s; }
#timer {
  position:absolute; top:12px; right:16px; color:#ffd60a;
  font-size:18px; font-weight:bold; text-shadow:1px 1px 3px #000;
}
#level-badge {
  position:absolute; top:10px; left:50%; transform:translateX(-50%);
  color:#ffd60a; font-size:16px; font-weight:bold;
  text-shadow:1px 1px 3px #000;
}
#kill-count {
  position:absolute; top:36px; right:16px; color:#aaa;
  font-size:13px; text-shadow:1px 1px 2px #000;
}
#level-up-screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.75); display:none; pointer-events:auto;
  justify-content:center; align-items:center; flex-direction:column;
}
#level-up-screen.active { display:flex; }
#level-up-title { color:#ffd60a; font-size:28px; font-weight:bold; margin-bottom:24px; }
#level-up-options { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:700px; }
.upgrade-card {
  width:200px; padding:16px; background:#1a1a2e; border:2px solid #333;
  border-radius:8px; cursor:pointer; text-align:center; color:#fff;
  transition:border-color 0.2s, transform 0.2s; pointer-events:auto;
}
.upgrade-card:hover { border-color:#ffd60a; transform:translateY(-4px); }
.upgrade-card .card-icon { font-size:36px; margin-bottom:8px; }
.upgrade-card .card-name { font-size:16px; font-weight:bold; color:#4895ef; margin-bottom:6px; }
.upgrade-card .card-desc { font-size:12px; color:#aaa; line-height:1.4; }
.upgrade-card .card-level { font-size:11px; color:#666; margin-top:6px; }
/* 分支选择特殊卡牌 */
.upgrade-card.branch-power {
  width:240px; border-color:#e63946; background:linear-gradient(180deg,#2a1a1e,#1a1a2e);
}
.upgrade-card.branch-power:hover { border-color:#ff6b6b; box-shadow:0 0 20px rgba(230,57,70,0.3); }
.upgrade-card.branch-power .card-name { color:#e63946; }
.upgrade-card.branch-wisdom {
  width:240px; border-color:#00b4d8; background:linear-gradient(180deg,#1a252e,#1a1a2e);
}
.upgrade-card.branch-wisdom:hover { border-color:#48cae4; box-shadow:0 0 20px rgba(0,180,216,0.3); }
.upgrade-card.branch-wisdom .card-name { color:#00b4d8; }
.upgrade-card .card-preview { font-size:10px; color:#777; margin-top:8px; line-height:1.5; text-align:left; border-top:1px solid #333; padding-top:6px; }
#level-up-title.branch-select { color:#ffd60a; font-size:24px; }
#level-up-subtitle { color:#888; font-size:13px; margin-bottom:16px; }
/* 分支选择卡牌（内部两个按钮） */
.upgrade-card.branch-select-card {
  width:240px; border:2px solid #555; background:#1a1a2e;
  cursor:default;
}
.upgrade-card.branch-select-card:hover {
  border-color:#ffd60a; transform:translateY(-4px);
}
.branch-buttons {
  display:flex; gap:8px; margin-top:12px;
}
.branch-btn {
  flex:1; padding:10px 4px; border:2px solid #444; border-radius:6px;
  background:#222; color:#fff; cursor:pointer; text-align:center;
  transition:border-color 0.2s, background 0.2s; pointer-events:auto;
  display:flex; flex-direction:column; align-items:center;
}
.branch-btn:hover { transform:scale(1.05); }
.branch-power-btn { border-color:#e63946; }
.branch-power-btn:hover { background:#2a1a1e; border-color:#ff6b6b; box-shadow:0 0 12px rgba(230,57,70,0.3); }
.branch-wisdom-btn { border-color:#00b4d8; }
.branch-wisdom-btn:hover { background:#1a252e; border-color:#48cae4; box-shadow:0 0 12px rgba(0,180,216,0.3); }
.branch-btn-icon { font-size:24px; margin-bottom:4px; }
.branch-btn-name { font-size:14px; font-weight:bold; margin-bottom:2px; }
.branch-power-btn .branch-btn-name { color:#e63946; }
.branch-wisdom-btn .branch-btn-name { color:#00b4d8; }
.branch-btn-desc { font-size:9px; color:#888; line-height:1.3; }
#start-screen, #gameover-screen {
  position:absolute; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.9); display:flex; justify-content:center;
  align-items:center; flex-direction:column; pointer-events:auto;
}
#start-screen.hidden, #gameover-screen.hidden { display:none; }
.screen-title { color:#e63946; font-size:36px; font-weight:bold; margin-bottom:12px; text-shadow:0 0 20px rgba(230,57,70,0.5); }
.scren-subtitle { color:#888; font-size:14px; margin-bottom:32px; }
.screen-btn {
  padding:12px 36px; background:#e63946; color:#fff; border:none;
  font-size:16px; border-radius:6px; cursor:pointer;
  transition:background 0.2s, transform 0.2s; pointer-events:auto;
}
.screen-btn:hover { background:#ff4d5a; transform:scale(1.05); }
.screen-stats { color:#aaa; font-size:13px; margin-top:20px; line-height:1.8; text-align:center; }
.screen-stats span { color:#ffd60a; font-weight:bold; }
.dmg-number {
  position:absolute; color:#fff; font-size:14px; font-weight:bold;
  pointer-events:none; text-shadow:1px 1px 2px #000;
  animation:dmgFloat 0.8s ease-out forwards;
}
@keyframes dmgFloat {
  0% { opacity:1; transform:translateY(0); }
  100% { opacity:0; transform:translateY(-40px); }
}
</style>
</head>
<body>
<div id="game-stage">
<canvas id="game-canvas"></canvas>
<div id="ui-overlay">
  <div id="hud">
    <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
    <div id="xp-bar-outer"><div id="xp-bar-inner"></div></div>
    <div id="level-text" style="margin-top:4px;color:#888;font-size:12px;">LV 1</div>
  </div>
  <div id="timer">00:00</div>
  <div id="level-badge"></div>
  <div id="kill-count">Kills: 0</div>
  <div id="wave-info" style="position:absolute;top:60px;right:16px;color:#888;font-size:12px;text-shadow:1px 1px 2px #000;">Wave 1</div>

  <div id="level-up-screen">
    <div id="level-up-title">LEVEL UP</div>
    <div id="level-up-subtitle" style="display:none"></div>
    <div id="level-up-options"></div>
  </div>

  <div id="start-screen">
    <div class="screen-title">DARK SURVIVORS</div>
    <div class="scren-subtitle">活下去，直到黎明</div>
    <div style="color:#666;font-size:12px;margin-bottom:24px;line-height:1.8;text-align:center;">
      WASD / 方向键 移动 | 武器自动攻击<br>
      收集经验宝石升级 | 选择强化能力<br>
      敌人分波次进攻，存活尽可能久！
    </div>
    <button class="screen-btn" onclick="Game.start()">开始游戏</button>
  </div>

  <div id="gameover-screen" class="hidden">
    <div class="screen-title" id="go-title">你倒下了</div>
    <div class="scren-subtitle" id="go-subtitle"></div>
    <div class="screen-stats" id="go-stats"></div>
    <button class="screen-btn" onclick="Game.start()" style="margin-top:16px;">再来一局</button>
  </div>
</div>
</div>

<script>
// ============ 工具函数 ============
const $ = function(id) { return document.getElementById(id); };

// ============ Entity 基类 ============
const Entity = function(x, y, w, h) {
  this.x = x; this.y = y;
  this.w = w || 0; this.h = h || 0;
  this.dead = false;
};
Entity.prototype.overlaps = function(other) {
  return this.x - this.w/2 < other.x + other.w/2 &&
         this.x + this.w/2 > other.x - other.w/2 &&
         this.y - this.h/2 < other.y + other.h/2 &&
         this.y + this.h/2 > other.y - other.h/2;
};
Entity.prototype.update = function(dt) {};
Entity.prototype.render = function(ctx, cam) {};

// ============ EntityManager ============
const EntityManager = function() { this.entities = new Set(); };
EntityManager.prototype.add = function(e) { this.entities.add(e); e._em = this; };
EntityManager.prototype.remove = function(e) { e._em = null; this.entities.delete(e); };
EntityManager.prototype.clear = function() { this.entities.forEach(function(e){e._em=null;}); this.entities.clear(); };
EntityManager.prototype.forEach = function(fn) { this.entities.forEach(fn); };
EntityManager.prototype.filter = function(type) {
  var r = []; this.entities.forEach(function(e){ if (e instanceof type) r.push(e); }); return r;
};
EntityManager.prototype.update = function(dt) {
  var dead = [];
  var self = this;
  this.entities.forEach(function(e){
    if (e instanceof Player) return;          // 主循环单独更新
    if (e instanceof Enemy) {                 // 主循环单独更新
      if (e.dead) dead.push(e);
      return;
    }
    if (e instanceof EnemyProjectile) {       // 主循环单独更新
      if (e.dead) dead.push(e);
      return;
    }
    e.update(dt);
    if (e.dead) dead.push(e);
  });
  dead.forEach(function(e){ self.remove(e); });
};

EntityManager.prototype.render = function(ctx, cam) {
  this.entities.forEach(function(e){
    if (e.dead) return;
    if (cam.isVisible(e.x, e.y, 80)) e.render(ctx, cam);
  });
};

// ============ Camera ============
const Camera = function(vw, vh) { this.x=0; this.y=0; this.viewW=vw; this.viewH=vh; };
Camera.prototype.follow = function(target, lerp) {
  lerp = lerp || 0.1;
  var tx = target.x - this.viewW/2, ty = target.y - this.viewH/2;
  var c = clampCameraPos(tx, ty, this.viewW, this.viewH);
  tx = c.x; ty = c.y;
  this.x += (tx - this.x) * lerp;
  this.y += (ty - this.y) * lerp;
};
Camera.prototype.isVisible = function(wx, wy, margin) {
  margin = margin || 64;
  return wx > this.x - margin && wx < this.x + this.viewW + margin &&
         wy > this.y - margin && wy < this.y + this.viewH + margin;
};
Camera.prototype.resize = function(w, h) { this.viewW=w; this.viewH=h; };

// ============ World（土豆兄弟式固定竞技场） ============
var WORLD = { halfW: 520, halfH: 380 };
function clampPosition(x, y, halfW, halfH) {
  halfW = halfW || 0; halfH = halfH || 0;
  return {
    x: Math.max(-WORLD.halfW + halfW, Math.min(WORLD.halfW - halfW, x)),
    y: Math.max(-WORLD.halfH + halfH, Math.min(WORLD.halfH - halfH, y))
  };
}
function clampCameraPos(x, y, viewW, viewH) {
  var worldW = WORLD.halfW * 2, worldH = WORLD.halfH * 2;
  var cx = x, cy = y;
  if (viewW >= worldW) cx = -WORLD.halfW;
  else cx = Math.max(-WORLD.halfW, Math.min(WORLD.halfW - viewW, cx));
  if (viewH >= worldH) cy = -WORLD.halfH;
  else cy = Math.max(-WORLD.halfH, Math.min(WORLD.halfH - viewH, cy));
  return { x: cx, y: cy };
}
function spawnPointAroundPlayer(px, py, minDist, maxDist) {
  var angle = Math.random() * Math.PI * 2;
  var dist = minDist + Math.random() * (maxDist - minDist);
  return clampPosition(px + Math.cos(angle) * dist, py + Math.sin(angle) * dist, 16, 16);
}

// ============ InputManager ============
const InputManager = function() {
  this.keys = {};
  var self = this;
  window.addEventListener('keydown', function(e) {
    self.keys[e.code] = true;
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  });
  window.addEventListener('keyup', function(e) { self.keys[e.code] = false; });
  window.addEventListener('blur', function() { self.keys = {}; });
};
InputManager.prototype.isDown = function(code) { return !!this.keys[code]; };
InputManager.prototype.getMoveDir = function() {
  var dx=0, dy=0;
  if (this.isDown('KeyA')||this.isDown('ArrowLeft')) dx -= 1;
  if (this.isDown('KeyD')||this.isDown('ArrowRight')) dx += 1;
  if (this.isDown('KeyW')||this.isDown('ArrowUp')) dy -= 1;
  if (this.isDown('KeyS')||this.isDown('ArrowDown')) dy += 1;
  var len = Math.sqrt(dx*dx + dy*dy);
  if (len > 0) { dx /= len; dy /= len; }
  return {dx:dx, dy:dy};
};

// ============ Player ============
const Player = function(x, y) {
  Entity.call(this, x, y, 28, 28);
  this.speed = 160;
  this.maxHp = 100; this.hp = this.maxHp;
  this.armor = 0; this.pickupRange = 60;
  this.xp = 0; this.level = 1; this.xpToNext = 10;
  this.kills = 0;
  this.invincibleTimer = 0; this.flashTimer = 0;
  this.damageMultiplier = 1;
  this.slowTimer = 0;
};
Player.prototype = Object.create(Entity.prototype);
Player.prototype.constructor = Player;
Player.prototype.takeDamage = function(amount) {
  if (this.invincibleTimer > 0) return;
  var dmg = Math.max(1, amount - this.armor);
  this.hp -= dmg;
  this.invincibleTimer = 0.5;
  this.flashTimer = 0.3;
  if (this.hp <= 0) { this.hp = 0; this.dead = true; }
};
Player.prototype.addXp = function(amount) {
  this.xp += amount;
  var leveled = false;
  while (this.xp >= this.xpToNext) {
    this.xp -= this.xpToNext;
    this.level++;
    this.xpToNext = Math.floor(10 + this.level * 8 + this.level * this.level * 0.5);
    leveled = true;
  }
  return leveled;
};
Player.prototype.update = function(dt, moveDir) {
  // 防御性检查
  if (!moveDir) moveDir = {dx:0, dy:0};
  // 减速效果
  if (this.slowTimer > 0) this.slowTimer -= dt;
  var speedMul = this.slowTimer > 0 ? 0.5 : 1.0;
  this.x += moveDir.dx * this.speed * speedMul * dt;
  this.y += moveDir.dy * this.speed * speedMul * dt;
  var clamped = clampPosition(this.x, this.y, this.w/2, this.h/2);
  this.x = clamped.x; this.y = clamped.y;
  if (this.invincibleTimer > 0) this.invincibleTimer -= dt;
  if (this.flashTimer > 0) this.flashTimer -= dt;
  // 生命回复
  if (this.hpRegen && this.hpRegen > 0 && this.hp < this.maxHp) {
    this.hp = Math.min(this.maxHp, this.hp + this.hpRegen * dt);
  }
};
Player.prototype.render = function(ctx, cam) {
  var sx = this.x - cam.x, sy = this.y - cam.y;
  if (this.flashTimer > 0 && Math.floor(this.flashTimer * 20) % 2 === 0) return;
  // 减速视觉反馈
  if (this.slowTimer > 0) {
    ctx.fillStyle = 'rgba(45,106,79,0.3)';
    ctx.beginPath(); ctx.arc(sx, sy, 18, 0, Math.PI*2); ctx.fill();
  }
  // 身体
  ctx.fillStyle = '#3a86ff';
  ctx.beginPath(); ctx.arc(sx, sy, 14, 0, Math.PI*2); ctx.fill();
  // 眼睛
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(sx-4, sy-3, 3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+4, sy-3, 3, 0, Math.PI*2); ctx.fill();
  // 瞳孔
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(sx-4, sy-3, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+4, sy-3, 1.5, 0, Math.PI*2); ctx.fill();
  // 拾取范围（半透明）
  ctx.strokeStyle = 'rgba(72,149,239,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(sx, sy, this.pickupRange, 0, Math.PI*2); ctx.stroke();
};

// ============ Enemy ============
const ENEMY_TYPES = {
  bat:     {name:'蝙蝠',   hp:5,   speed:100, damage:5,  w:18, h:18, xp:1,  color:'#8338ec', attackCooldown:1.0, mass:0.5},
  zombie:  {name:'僵尸',   hp:25,  speed:45,  damage:10, w:24, h:24, xp:3,  color:'#2d6a4f', attackCooldown:1.2, mass:1.0, slowOnHit:0.6},
  ghost:   {name:'幽灵',   hp:30,  speed:110, damage:8,  w:20, h:20, xp:6,  color:'#adb5bd', attackCooldown:0.6, mass:0.3, phaseAbility:true},
  demon:   {name:'恶魔',   hp:100, speed:50,  damage:20, w:30, h:30, xp:15, color:'#d00000', attackCooldown:1.5, mass:1.5, chargeAbility:true},
  boss:    {name:'BOSS',   hp:500, speed:35,  damage:30, w:48, h:48, xp:50, color:'#ff006e', attackCooldown:2.0, mass:3.0},
  // 新增特殊敌人
  slime:      {name:'史莱姆', hp:50,  speed:40,  damage:8,  w:28, h:28, xp:6,  color:'#22c55e', attackCooldown:1.0, mass:2.5}, // 分裂型
  slime_small:{name:'小史莱姆',hp:15, speed:55,  damage:5,  w:16, h:16, xp:2,  color:'#86efac', attackCooldown:1.0, mass:1.0}, // 不再分裂
  archer:     {name:'弓骷髅', hp:45,  speed:60,  damage:8,  w:22, h:22, xp:7,  color:'#f0e68c', attackCooldown:2.0, mass:0.7}, // 远程型，接触伤害低
  bomber:     {name:'爆炸幽灵',hp:20,  speed:130, damage:18, w:22, h:22, xp:8,  color:'#ff4d4d', attackCooldown:999, mass:0.4}, // 接触引爆，无普通攻击
};
const Enemy = function(x, y, typeName, diffScale) {
  var type = ENEMY_TYPES[typeName];
  Entity.call(this, x, y, type.w, type.h);
  this.typeName = typeName;
  this.color = type.color;
  this.mass = type.mass || 1;
  this.maxHp = Math.floor(type.hp * (diffScale||1));
  this.hp = this.maxHp;
  this.speed = type.speed * (0.9 + Math.random()*0.2);
  this.damage = Math.floor(type.damage * (diffScale||1));
  this.attackCooldown = type.attackCooldown;
  this.attackTimer = 0;
  this.xpValue = type.xp;
  this.hitFlashTimer = 0;
  this.animPhase = Math.random()*Math.PI*2;
  this.pushVx = 0; this.pushVy = 0;
  this.diffScale = diffScale || 1;

  // 弓骷髅：远程攻击计时器
  if (typeName === 'archer') {
    this.shootTimer = 1.0 + Math.random(); // 随机错开首次射击
  }
  // 爆炸幽灵：闪烁预警状态
  if (typeName === 'bomber') {
    this.explodeRange = 80;   // 爆炸触发半径
    this.blinkTimer = 0;      // 闪烁计时（靠近时触发）
    this.blinking = false;    // 是否已进入预警
    this.blinkSpeed = 8;      // 闪烁频率
  }
  // 幽灵：闪烁隐身能力
  if (typeName === 'ghost') {
    this.phaseTimer = 0;
    this.phaseCycle = 3.0; // 3秒一轮（1.5秒可见+1.5秒半隐）
    this.phaseAlpha = 1.0;
  }
  // 恶魔：冲锋能力
  if (typeName === 'demon') {
    this.chargeTimer = 3 + Math.random() * 2; // 首次冲锋延迟
    this.charging = false;
    this.chargeSpeed = 220;
    this.chargeDuration = 0.6;
    this.chargeTime = 0;
    this.chargeAngle = 0;
    this.chargeCooldown = 5; // 冲锋冷却5秒
  }
};
Enemy.prototype = Object.create(Entity.prototype);
Enemy.prototype.constructor = Enemy;
Enemy.prototype.moveToward = function(tx, ty, dt, enemies, overrideSpeed) {
  var dx = tx-this.x, dy = ty-this.y;
  var dist = Math.sqrt(dx*dx+dy*dy);
  var spd = overrideSpeed !== undefined ? overrideSpeed : this.speed;
  var vx = 0, vy = 0;
  if (dist > 2) {
    vx = (dx/dist)*spd;
    vy = (dy/dist)*spd;
  }
  // 简单的敌人之间推开（避免完全重叠）
  var self = this;
  if (enemies) {
    enemies.forEach(function(other){
      if (other === self || other.dead) return;
      var odx = self.x - other.x, ody = self.y - other.y;
      var odist = Math.sqrt(odx*odx + ody*ody);
      var minDist = (self.w + other.w) * 0.4;
      if (odist < minDist && odist > 0.1) {
        var push = (minDist - odist) * 5;
        vx += (odx/odist) * push;
        vy += (ody/odist) * push;
      }
    });
  }
  // 应用击退衰减
  this.pushVx *= 0.9;
  this.pushVy *= 0.9;
  vx += this.pushVx;
  vy += this.pushVy;
  this.x += vx * dt;
  this.y += vy * dt;
  var clamped = clampPosition(this.x, this.y, this.w/2, this.h/2);
  this.x = clamped.x; this.y = clamped.y;
  this.animPhase += dt * 5;
};
Enemy.prototype.takeDamage = function(amount, sourceX, sourceY) {
  if (this.dead) return false;
  this.hp -= amount;
  this.hitFlashTimer = 0.12;
  // 击退
  if (sourceX !== undefined && sourceY !== undefined) {
    var dx = this.x - sourceX, dy = this.y - sourceY;
    var dist = Math.sqrt(dx*dx + dy*dy);
    if (dist > 0.1) {
      var knockback = 80 / this.mass;
      this.pushVx = (dx/dist) * knockback;
      this.pushVy = (dy/dist) * knockback;
    }
  }
  if (this.hp <= 0) {
    this.hp = 0;
    this.dead = true;
    this.hitFlashTimer = 0;
  }
  return this.dead;
};
Enemy.prototype.canAttack = function() {
  return this.attackTimer <= 0;
};
Enemy.prototype.onAttack = function() {
  this.attackTimer = this.attackCooldown;
};
Enemy.prototype.update = function(dt, px, py, enemies, em) {
  if (this.dead) return;

  // ---- 幽灵 AI：周期性隐身，隐身时半伤 ----
  if (this.typeName === 'ghost') {
    this.phaseTimer += dt;
    // 周期循环：0-1.5s可见(alpha=1), 1.5-2.25s渐隐, 2.25-3.0s渐现
    var phase = this.phaseTimer % this.phaseCycle;
    if (phase < 1.5) {
      this.phaseAlpha = 1.0;
    } else if (phase < 2.0) {
      this.phaseAlpha = 1.0 - (phase - 1.5) / 0.5; // 渐隐到0.2
    } else if (phase < 2.75) {
      this.phaseAlpha = 0.2; // 完全隐身
    } else {
      this.phaseAlpha = 0.2 + (phase - 2.75) / 0.25; // 渐现到1.0
    }
    this.moveToward(px, py, dt, enemies, this.speed);
    if (this.attackTimer > 0) this.attackTimer -= dt;
    if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;
    return;
  }

  // ---- 恶魔 AI：普通追踪 + 冲锋技能 ----
  if (this.typeName === 'demon') {
    if (this.charging) {
      this.chargeTime += dt;
      // 沿冲锋方向高速移动
      this.x += Math.cos(this.chargeAngle) * this.chargeSpeed * dt;
      this.y += Math.sin(this.chargeAngle) * this.chargeSpeed * dt;
      var clamped = clampPosition(this.x, this.y, this.w/2, this.h/2);
      this.x = clamped.x; this.y = clamped.y;
      if (this.chargeTime >= this.chargeDuration) {
        this.charging = false;
        this.chargeTimer = this.chargeCooldown;
      }
      this.animPhase += dt * 10;
    } else {
      this.chargeTimer -= dt;
      if (this.chargeTimer <= 0) {
        // 开始冲锋：锁定当前玩家方向
        var dx = px - this.x, dy = py - this.y;
        var dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > 60) {
          this.chargeAngle = Math.atan2(dy, dx);
          this.charging = true;
          this.chargeTime = 0;
        } else {
          this.chargeTimer = 1; // 太近就不冲
        }
      }
      this.moveToward(px, py, dt, enemies, this.speed);
    }
    if (this.attackTimer > 0) this.attackTimer -= dt;
    if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;
    return;
  }

  // ---- 弓骷髅 AI：保持距离，远程射箭 ----
  if (this.typeName === 'archer') {
    var dx = px - this.x, dy = py - this.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var preferDist = 320; // 希望保持的距离
    var vx = 0, vy = 0;
    if (dist > 0.1) {
      if (dist > preferDist + 40) {
        // 太远：靠近
        vx = (dx/dist) * this.speed;
        vy = (dy/dist) * this.speed;
      } else if (dist < preferDist - 40) {
        // 太近：后退
        vx = -(dx/dist) * this.speed * 0.8;
        vy = -(dy/dist) * this.speed * 0.8;
      } else {
        // 适距：横向移动（绕圈）
        vx = -dy/dist * this.speed * 0.5;
        vy = dx/dist * this.speed * 0.5;
      }
    }
    // 推开逻辑
    var self = this;
    if (enemies) {
      enemies.forEach(function(other){
        if (other === self || other.dead) return;
        var odx = self.x - other.x, ody = self.y - other.y;
        var odist = Math.sqrt(odx*odx + ody*ody);
        var minDist = (self.w + other.w) * 0.4;
        if (odist < minDist && odist > 0.1) {
          var push = (minDist - odist) * 5;
          vx += (odx/odist) * push;
          vy += (ody/odist) * push;
        }
      });
    }
    this.pushVx *= 0.9; this.pushVy *= 0.9;
    vx += this.pushVx; vy += this.pushVy;
    this.x += vx * dt; this.y += vy * dt;
    var clamped = clampPosition(this.x, this.y, this.w/2, this.h/2);
    this.x = clamped.x; this.y = clamped.y;
    this.animPhase += dt * 5;
    // 射箭计时
    if (this.shootTimer > 0) this.shootTimer -= dt;
    if (this.attackTimer > 0) this.attackTimer -= dt;
    if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;
    return;
  }

  // ---- 爆炸幽灵 AI：快速追踪，靠近后闪烁预警再爆 ----
  if (this.typeName === 'bomber') {
    var dx = px - this.x, dy = py - this.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var spd = this.speed;
    if (dist < 150) spd *= 1.4; // 靠近时加速
    this.moveToward(px, py, dt, enemies, spd);
    // 闪烁预警：距离 < 80px 时开始闪
    if (dist < 80 && !this.blinking) {
      this.blinking = true;
      this.blinkTimer = 0;
    }
    if (this.blinking) {
      this.blinkTimer += dt;
      this.blinkSpeed = 8 + this.blinkTimer * 6; // 越来越快
    }
    if (this.attackTimer > 0) this.attackTimer -= dt;
    if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;
    return;
  }

  // ---- 普通 AI ----
  this.moveToward(px, py, dt, enemies, this.speed);
  if (this.attackTimer > 0) this.attackTimer -= dt;
  if (this.hitFlashTimer > 0) this.hitFlashTimer -= dt;
};
Enemy.prototype.render = function(ctx, cam) {
  if (this.dead) return;
  var sx = this.x-cam.x, sy = this.y-cam.y, r = this.w/2;

  // ---- 史莱姆：果冻形，带内部高光 ----
  if (this.typeName === 'slime' || this.typeName === 'slime_small') {
    var squish = 1 + Math.sin(this.animPhase) * 0.08;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(squish, 1/squish);
    ctx.fillStyle = this.hitFlashTimer > 0 ? '#fff' : this.color;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();
    // 高光
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.ellipse(-r*0.2, -r*0.3, r*0.35, r*0.2, -0.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
    // 眼睛（横向拉伸的小眼）
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(sx-r*0.3, sy-r*0.1, r*0.18, r*0.13, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx+r*0.3, sy-r*0.1, r*0.18, r*0.13, 0, 0, Math.PI*2); ctx.fill();
    if (this.hp > 0 && this.hp < this.maxHp) {
      var barW = this.w+4, barH = 3;
      ctx.fillStyle = '#333'; ctx.fillRect(sx-barW/2, sy-r-8, barW, barH);
      ctx.fillStyle = '#22c55e'; ctx.fillRect(sx-barW/2, sy-r-8, barW*(this.hp/this.maxHp), barH);
    }
    return;
  }

  // ---- 弓骷髅：骷髅头 + 弓形装饰 ----
  if (this.typeName === 'archer') {
    var flash = this.hitFlashTimer > 0;
    // 主体（骷髅圆头）
    ctx.fillStyle = flash ? '#fff' : this.color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    // 骷髅颌骨
    ctx.fillStyle = flash ? '#fff' : '#ccc';
    ctx.fillRect(sx-r*0.4, sy+r*0.2, r*0.8, r*0.35);
    ctx.fillStyle = flash ? '#fff' : this.color;
    ctx.fillRect(sx-r*0.3, sy+r*0.28, r*0.22, r*0.25);
    ctx.fillRect(sx+r*0.08, sy+r*0.28, r*0.22, r*0.25);
    // 眼睛（骷髅空洞）
    ctx.fillStyle = flash ? '#e63946' : '#111';
    ctx.beginPath(); ctx.ellipse(sx-r*0.3, sy-r*0.15, r*0.22, r*0.18, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx+r*0.3, sy-r*0.15, r*0.22, r*0.18, 0, 0, Math.PI*2); ctx.fill();
    // 弓（弧形线条）
    ctx.strokeStyle = flash ? '#fff' : '#a0522d';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(sx+r*1.1, sy, r*0.8, Math.PI*0.6, Math.PI*1.4);
    ctx.stroke();
    ctx.strokeStyle = flash ? '#fff' : '#ffd700';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(sx+r*1.1, sy-r*0.64);
    ctx.lineTo(sx+r*1.1, sy+r*0.64);
    ctx.stroke();
    if (this.hp > 0 && this.hp < this.maxHp) {
      var barW = this.w+4, barH = 3;
      ctx.fillStyle = '#333'; ctx.fillRect(sx-barW/2, sy-r-8, barW, barH);
      ctx.fillStyle = '#f0e68c'; ctx.fillRect(sx-barW/2, sy-r-8, barW*(this.hp/this.maxHp), barH);
    }
    return;
  }

  // ---- 爆炸幽灵：闪烁红色圆球，边缘有火焰粒子感 ----
  if (this.typeName === 'bomber') {
    var showBright = !this.blinking || (Math.floor(this.blinkTimer * this.blinkSpeed) % 2 === 0);
    var baseColor = showBright ? this.color : '#ff9900';
    ctx.fillStyle = this.hitFlashTimer > 0 ? '#fff' : baseColor;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    // 内核（白色中心）
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.beginPath(); ctx.arc(sx, sy, r*0.45, 0, Math.PI*2); ctx.fill();
    // 爆炸范围预警圈（靠近时显示）
    if (this.blinking) {
      var alpha = 0.15 + Math.sin(this.blinkTimer * this.blinkSpeed * Math.PI) * 0.15;
      ctx.strokeStyle = 'rgba(255,77,0,' + (alpha+0.3) + ')';
      ctx.lineWidth = 2;
      ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.arc(sx, sy, this.explodeRange, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
    // 眼睛（X型）
    ctx.strokeStyle = this.hitFlashTimer > 0 ? '#e63946' : '#111';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(sx-r*0.35, sy-r*0.3); ctx.lineTo(sx-r*0.1, sy-r*0.05);
    ctx.moveTo(sx-r*0.1, sy-r*0.3); ctx.lineTo(sx-r*0.35, sy-r*0.05);
    ctx.moveTo(sx+r*0.1, sy-r*0.3); ctx.lineTo(sx+r*0.35, sy-r*0.05);
    ctx.moveTo(sx+r*0.35, sy-r*0.3); ctx.lineTo(sx+r*0.1, sy-r*0.05);
    ctx.stroke();
    if (this.hp > 0 && this.hp < this.maxHp) {
      var barW = this.w+4, barH = 3;
      ctx.fillStyle = '#333'; ctx.fillRect(sx-barW/2, sy-r-8, barW, barH);
      ctx.fillStyle = '#ff4d4d'; ctx.fillRect(sx-barW/2, sy-r-8, barW*(this.hp/this.maxHp), barH);
    }
    return;
  }

  // ---- 恶魔：冲锋时有拖影 ----
  if (this.typeName === 'demon') {
    var dFlash = this.hitFlashTimer > 0;
    // 冲锋拖影
    if (this.charging) {
      ctx.globalAlpha = 0.3;
      ctx.fillStyle = dFlash ? '#fff' : '#ff4444';
      ctx.beginPath(); ctx.arc(sx - Math.cos(this.chargeAngle)*16, sy - Math.sin(this.chargeAngle)*16, r*0.8, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 0.15;
      ctx.beginPath(); ctx.arc(sx - Math.cos(this.chargeAngle)*32, sy - Math.sin(this.chargeAngle)*32, r*0.6, 0, Math.PI*2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = dFlash ? '#fff' : this.color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    // 角
    ctx.fillStyle = dFlash ? '#fff' : '#8b0000';
    ctx.beginPath(); ctx.moveTo(sx-r*0.6, sy-r*0.4); ctx.lineTo(sx-r*0.3, sy-r*1.1); ctx.lineTo(sx-r*0.0, sy-r*0.4); ctx.fill();
    ctx.beginPath(); ctx.moveTo(sx+r*0.0, sy-r*0.4); ctx.lineTo(sx+r*0.3, sy-r*1.1); ctx.lineTo(sx+r*0.6, sy-r*0.4); ctx.fill();
    // 眼睛
    ctx.fillStyle = dFlash ? '#e63946' : '#ff0';
    ctx.beginPath(); ctx.arc(sx-r*0.3, sy-r*0.1, r*0.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+r*0.3, sy-r*0.1, r*0.2, 0, Math.PI*2); ctx.fill();
    // 冲锋冷却指示（小CD条）
    if (!this.charging && this.chargeTimer > 0) {
      var cdRatio = Math.max(0, 1 - this.chargeTimer / this.chargeCooldown);
      ctx.fillStyle = '#333'; ctx.fillRect(sx-r, sy-r-10, r*2, 3);
      ctx.fillStyle = '#ff6b6b'; ctx.fillRect(sx-r, sy-r-10, r*2*cdRatio, 3);
    }
    if (this.hp > 0 && this.hp < this.maxHp) {
      var barW = this.w+4, barH = 3;
      ctx.fillStyle = '#333'; ctx.fillRect(sx-barW/2, sy-r-14, barW, barH);
      ctx.fillStyle = '#d00000'; ctx.fillRect(sx-barW/2, sy-r-14, barW*(this.hp/this.maxHp), barH);
    }
    return;
  }

  // ---- 幽灵：隐身闪烁 ----
  if (this.typeName === 'ghost') {
    ctx.globalAlpha = this.phaseAlpha;
    ctx.fillStyle = this.hitFlashTimer > 0 ? '#fff' : this.color;
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
    // 内部波纹
    ctx.fillStyle = 'rgba(255,255,255,' + (0.2 * this.phaseAlpha) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, r*0.5, 0, Math.PI*2); ctx.fill();
    // 眼睛
    ctx.fillStyle = 'rgba(0,0,0,' + this.phaseAlpha + ')';
    ctx.beginPath(); ctx.arc(sx-r*0.25, sy-r*0.1, r*0.15, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+r*0.25, sy-r*0.1, r*0.15, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
    // 隐身提示（虚线圈）
    if (this.phaseAlpha < 0.5) {
      ctx.strokeStyle = 'rgba(173,181,189,0.3)';
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(sx, sy, r+4, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (this.hp > 0 && this.hp < this.maxHp) {
      ctx.globalAlpha = Math.max(this.phaseAlpha, 0.4);
      var barW = this.w+4, barH = 3;
      ctx.fillStyle = '#333'; ctx.fillRect(sx-barW/2, sy-r-8, barW, barH);
      ctx.fillStyle = '#adb5bd'; ctx.fillRect(sx-barW/2, sy-r-8, barW*(this.hp/this.maxHp), barH);
      ctx.globalAlpha = 1;
    }
    return;
  }

  // ---- 普通敌人渲染 ----
  ctx.fillStyle = this.hitFlashTimer > 0 ? '#fff' : this.color;
  ctx.beginPath(); ctx.arc(sx, sy, r, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = this.hitFlashTimer > 0 ? '#e63946' : '#ff006e';
  ctx.beginPath(); ctx.arc(sx-r*0.3, sy-r*0.15, r*0.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(sx+r*0.3, sy-r*0.15, r*0.2, 0, Math.PI*2); ctx.fill();
  if (this.hp > 0 && this.hp < this.maxHp) {
    var barW = this.w+4, barH = 3;
    ctx.fillStyle = '#333'; ctx.fillRect(sx-barW/2, sy-r-8, barW, barH);
    ctx.fillStyle = '#e63946'; ctx.fillRect(sx-barW/2, sy-r-8, barW*(this.hp/this.maxHp), barH);
  }

// ============ Projectile ============
const Projectile = function(x, y, config) {
  Entity.call(this, x, y, config.w||10, config.h||10);
  this.speed = config.speed||300;
  this.damage = config.damage||10;
  this.dx = config.dx||0; this.dy = config.dy||0;
  this.piercing = config.piercing||1;
  this.lifetime = config.lifetime||2;
  this.color = config.color||'#ffd60a';
  this.type = config.type||'bullet';
  this.hitEnemies = new Set();
  this.trail = [];
  // 追踪
  this.homing = config.homing||0;
  // 分裂（命中时触发）
  this.onHitSplit = config.onHitSplit||null; // { count, damage, speed, color, w, h }
};
Projectile.prototype = Object.create(Entity.prototype);
Projectile.prototype.constructor = Projectile;
Projectile.prototype.update = function(dt) {
  // 追踪逻辑：转向最近的敌人
  if (this.homing > 0 && this._target && !this._target.dead) {
    var tdx = this._target.x - this.x;
    var tdy = this._target.y - this.y;
    var targetAngle = Math.atan2(tdy, tdx);
    var currentAngle = Math.atan2(this.dy, this.dx);
    var diff = targetAngle - currentAngle;
    // 规范化角度差到 [-PI, PI]
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    var turn = Math.min(Math.abs(diff), this.homing * dt);
    var newAngle = currentAngle + Math.sign(diff) * turn;
    this.dx = Math.cos(newAngle);
    this.dy = Math.sin(newAngle);
  }
  this.x += this.dx * this.speed * dt;
  this.y += this.dy * this.speed * dt;
  this.lifetime -= dt;
  this.trail.push({x:this.x, y:this.y, age:0});
  if (this.trail.length > 8) this.trail.shift();
  this.trail.forEach(function(t){ t.age += dt; });
  if (this.lifetime <= 0) this.dead = true;
};
Projectile.prototype.hitEnemy = function(enemy) {
  if (this.hitEnemies.has(enemy)) return false;
  this.hitEnemies.add(enemy);
  this.piercing--;
  if (this.piercing <= 0) this.dead = true;
  return true;
};
Projectile.prototype.render = function(ctx, cam) {
  if (this.trail.length > 1) {
    ctx.strokeStyle = this.color+'40';
    ctx.lineWidth = this.w*0.6;
    ctx.beginPath();
    ctx.moveTo(this.trail[0].x-cam.x, this.trail[0].y-cam.y);
    for (var i=1; i<this.trail.length; i++) ctx.lineTo(this.trail[i].x-cam.x, this.trail[i].y-cam.y);
    ctx.stroke();
  }
  var sx = this.x-cam.x, sy = this.y-cam.y;
  if (this.type === 'magic') {
    ctx.shadowColor = this.color; ctx.shadowBlur = 10;
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(sx, sy, this.w/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(sx, sy, this.w/4, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    ctx.fillStyle = this.color;
    var angle = Math.atan2(this.dy, this.dx);
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(this.w,0); ctx.lineTo(0,-this.w*0.4); ctx.lineTo(-this.w*0.5,0); ctx.lineTo(0,this.w*0.4);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
};

// ============ EnemyProjectile（敌方弹丸：弓骷髅的箭、爆炸幽灵死亡弹幕）============
const EnemyProjectile = function(x, y, config) {
  Entity.call(this, x, y, config.w||8, config.h||8);
  this.vx = config.vx || 0;
  this.vy = config.vy || 0;
  this.damage = config.damage || 5;
  this.lifetime = config.lifetime || 3;
  this.color = config.color || '#ffd60a';
  this.type = config.type || 'arrow'; // 'arrow' | 'death_orb'
  this.hasHit = false;
};
EnemyProjectile.prototype = Object.create(Entity.prototype);
EnemyProjectile.prototype.constructor = EnemyProjectile;
EnemyProjectile.prototype.update = function(dt) {
  this.x += this.vx * dt;
  this.y += this.vy * dt;
  this.lifetime -= dt;
  if (this.lifetime <= 0) this.dead = true;
  // 飞出竞技场就消失
  if (Math.abs(this.x) > WORLD.halfW + 50 || Math.abs(this.y) > WORLD.halfH + 50) this.dead = true;
};
EnemyProjectile.prototype.render = function(ctx, cam) {
  var sx = this.x - cam.x, sy = this.y - cam.y;
  if (this.type === 'arrow') {
    // 细长箭矢
    var angle = Math.atan2(this.vy, this.vx);
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.moveTo(10, 0); ctx.lineTo(0, -2.5); ctx.lineTo(-4, 0); ctx.lineTo(0, 2.5);
    ctx.closePath(); ctx.fill();
    // 箭杆
    ctx.strokeStyle = '#cc2222';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(-10, 0); ctx.stroke();
    ctx.restore();
  } else {
    // 死亡弹幕小圆球
    ctx.fillStyle = this.color;
    ctx.beginPath(); ctx.arc(sx, sy, this.w/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.arc(sx-this.w*0.15, sy-this.w*0.15, this.w*0.2, 0, Math.PI*2); ctx.fill();
  }
};

// ============ XpGem ============
const XpGem = function(x, y, value) {
  var tiers = [
    {min:1,  max:2,  size:8,  color:'#4895ef'},
    {min:3,  max:6,  size:12, color:'#4cc9f0'},
    {min:7,  max:15, size:16, color:'#7209b7'},
    {min:16, max:99, size:20, color:'#f72585'},
  ];
  var tier = tiers.find(function(t){ return value>=t.min && value<=t.max; }) || tiers[0];
  Entity.call(this, x, y, tier.size, tier.size);
  this.value = value;
  this.size = tier.size;
  this.color = tier.color;
  this.bobPhase = Math.random()*Math.PI*2;
  this.magnetized = false;
};
XpGem.prototype = Object.create(Entity.prototype);
XpGem.prototype.constructor = XpGem;
XpGem.prototype.update = function(dt, px, py, pickupRange) {
  this.bobPhase += dt*3;
  var dx = px-this.x, dy = py-this.y;
  var dist = Math.sqrt(dx*dx+dy*dy);
  if (dist < pickupRange) this.magnetized = true;
  if (this.magnetized) {
    // 防止除零错误
    if (dist > 0) {
      var speed = 400;
      this.x += (dx/dist)*speed*dt;
      this.y += (dy/dist)*speed*dt;
      // 重新计算距离（因为位置已更新）
      dx = px-this.x;
      dy = py-this.y;
      dist = Math.sqrt(dx*dx+dy*dy);
    }
    if (dist < 16) { this.dead = true; return this.value; }
  }
  return 0;
};
XpGem.prototype.render = function(ctx, cam) {
  var sx = this.x-cam.x, sy = this.y-cam.y + Math.sin(this.bobPhase)*2, r = this.size/2;
  ctx.fillStyle = this.color;
  ctx.beginPath(); ctx.moveTo(sx,sy-r); ctx.lineTo(sx+r*0.7,sy); ctx.lineTo(sx,sy+r); ctx.lineTo(sx-r*0.7,sy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.moveTo(sx,sy-r); ctx.lineTo(sx+r*0.3,sy-r*0.2); ctx.lineTo(sx,sy); ctx.lineTo(sx-r*0.3,sy-r*0.2); ctx.closePath(); ctx.fill();
};

// ============ HealthPotion 回血道具 ============
const POTION_TYPES = {
  small:   {heal:20, color:'#4ade80', size:10, w:16, h:16},
  large:   {heal:50, color:'#22c55e', size:14, w:20, h:20},
  chicken: {heal:0,  color:'#f59e0b', size:16, w:24, h:24}, // heal=0 表示回复50%最大生命
};
const HealthPotion = function(x, y, typeName) {
  var type = POTION_TYPES[typeName];
  Entity.call(this, x, y, type.w, type.h);
  this.typeName = typeName;
  this.heal = type.heal;
  this.color = type.color;
  this.size = type.size;
  this.bobPhase = Math.random()*Math.PI*2;
  this.magnetized = false;
  this.pickupRange = 50;
};
HealthPotion.prototype = Object.create(Entity.prototype);
HealthPotion.prototype.constructor = HealthPotion;
HealthPotion.prototype.update = function(dt, px, py, pickupRange) {
  this.bobPhase += dt*3;
  this.pickupRange = pickupRange || 50;
  var dx = px-this.x, dy = py-this.y;
  var dist = Math.sqrt(dx*dx+dy*dy);
  if (dist < this.pickupRange + 40) this.magnetized = true;
  if (this.magnetized) {
    if (dist > 0) {
      var speed = 350;
      this.x += (dx/dist)*speed*dt;
      this.y += (dy/dist)*speed*dt;
      dx = px-this.x; dy = py-this.y;
      dist = Math.sqrt(dx*dx+dy*dy);
    }
    if (dist < 18) { this.dead = true; return this.typeName; }
  }
  return null;
};
HealthPotion.prototype.render = function(ctx, cam) {
  var sx = this.x-cam.x, sy = this.y-cam.y + Math.sin(this.bobPhase)*3;
  var type = POTION_TYPES[this.typeName];
  // 瓶子形状
  ctx.fillStyle = type.color;
  ctx.beginPath();
  ctx.moveTo(sx-this.size*0.4, sy-this.size*0.3);
  ctx.lineTo(sx+this.size*0.4, sy-this.size*0.3);
  ctx.lineTo(sx+this.size*0.35, sy+this.size*0.3);
  ctx.lineTo(sx-this.size*0.35, sy+this.size*0.3);
  ctx.closePath(); ctx.fill();
  // 瓶口
  ctx.fillStyle = '#a1a1aa';
  ctx.fillRect(sx-this.size*0.15, sy-this.size*0.5, this.size*0.3, this.size*0.2);
  // 十字（医疗标志）
  ctx.fillStyle = '#fff';
  ctx.fillRect(sx-1, sy-this.size*0.15, 2, this.size*0.3);
  ctx.fillRect(sx-this.size*0.15, sy-1, this.size*0.3, 2);
  // 光晕
  ctx.strokeStyle = type.color+'40';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(sx, sy, this.size, 0, Math.PI*2); ctx.stroke();
};

// 掉落概率（参考 Vampire Survivors 的 Floor Chicken 机制）
// 普通敌人：小血瓶 15%，大血瓶 3%
// 精英/幽灵/弓骷髅：小血瓶 30%，大血瓶 10%
// BOSS：小血瓶 100%，大血瓶 50%，Floor Chicken（回复50%HP）25%
function rollHealthDrop(enemyTypeName) {
  var isBoss = enemyTypeName === 'boss';
  var isElite = (enemyTypeName === 'demon' || enemyTypeName === 'ghost' || enemyTypeName === 'archer');
  // bomber 死亡后已经很危险，给稍高的血瓶概率作为补偿
  var isBomber = enemyTypeName === 'bomber';
  if (isBoss) {
    if (Math.random() < 0.25) return 'chicken';
    if (Math.random() < 0.5) return 'large';
    return 'small';
  }
  var smallChance = isBomber ? 0.35 : (isElite ? 0.30 : 0.15);
  var largeChance = isBomber ? 0.12 : (isElite ? 0.10 : 0.03);
  if (Math.random() < largeChance) return 'large';
  if (Math.random() < smallChance) return 'small';
  return null;
}

// ============ DamageZone ============
const DamageZone = function(owner, config) {
  Entity.call(this, owner.x, owner.y, config.radius*2, config.radius*2);
  this.owner = owner;
  this.radius = config.radius;
  this.damage = config.damage||0;
  this.damageInterval = config.damageInterval||0.5;
  this.lifetime = config.lifetime||5;
  this.color = config.color||'#ff6b35';
  this.hitEnemies = new Set();
  this.timer = 0;
  this.rotation = 0;
};
DamageZone.prototype = Object.create(Entity.prototype);
DamageZone.prototype.constructor = DamageZone;
DamageZone.prototype.update = function(dt) {
  this.x = this.owner.x; this.y = this.owner.y;
  this.rotation += dt*2; this.timer += dt;
  if (this.lifetime > 0) {
    this.lifetime -= dt;
    if (this.lifetime <= 0) this.dead = true;
  }
  if (this.timer >= this.damageInterval) { this.timer -= this.damageInterval; this.hitEnemies.clear(); }
};
DamageZone.prototype.tryDamageEnemy = function(enemy) {
  if (this.hitEnemies.has(enemy)) return false;
  var dx = enemy.x-this.x, dy = enemy.y-this.y;
  var dist = Math.sqrt(dx*dx+dy*dy);
  if (dist <= this.radius + enemy.w/2) { this.hitEnemies.add(enemy); return true; }
  return false;
};
DamageZone.prototype.render = function(ctx, cam) {
  var sx = this.x-cam.x, sy = this.y-cam.y;
  // 解析颜色为 rgb
  var r=0,g=0,b=0;
  if (this.color && this.color[0]==='#') {
    r=parseInt(this.color.slice(1,3),16);
    g=parseInt(this.color.slice(3,5),16);
    b=parseInt(this.color.slice(5,7),16);
  }
  var grad = ctx.createRadialGradient(sx,sy,0, sx,sy,this.radius);
  grad.addColorStop(0, 'rgba('+r+','+g+','+b+',0.08)');
  grad.addColorStop(0.7, 'rgba('+r+','+g+','+b+',0.03)');
  grad.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba('+r+','+g+','+b+',0.3)';
  ctx.lineWidth = 2;
  ctx.setLineDash([8,12]); ctx.lineDashOffset = -this.rotation*30;
  ctx.beginPath(); ctx.arc(sx,sy,this.radius,0,Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
};

// ============ Spawner ============
// 波次配置：每波持续秒数、敌人类型权重、生成间隔、同屏上限、难度倍率
const WAVES = [
  { duration: 20, pool:[{type:'bat',w:1}],                                              interval:1.2, maxEnemies:15, diff:1.0 },
  { duration: 25, pool:[{type:'bat',w:2},{type:'zombie',w:1}],                          interval:1.0, maxEnemies:20, diff:1.2 },
  { duration: 25, pool:[{type:'bat',w:1},{type:'zombie',w:2},{type:'slime',w:1}],       interval:0.9, maxEnemies:22, diff:1.4 },
  { duration: 30, pool:[{type:'zombie',w:2},{type:'archer',w:1},{type:'slime',w:1}],    interval:0.8, maxEnemies:25, diff:1.6 },
  { duration: 30, pool:[{type:'zombie',w:1},{type:'archer',w:1},{type:'bomber',w:1}],   interval:0.7, maxEnemies:28, diff:1.8 },
  { duration: 30, pool:[{type:'ghost',w:2},{type:'slime',w:1},{type:'archer',w:1}],     interval:0.6, maxEnemies:32, diff:2.0 },
  { duration: 35, pool:[{type:'ghost',w:2},{type:'demon',w:1},{type:'bomber',w:1}],     interval:0.5, maxEnemies:35, diff:2.3 },
  { duration: 35, pool:[{type:'ghost',w:2},{type:'demon',w:2},{type:'archer',w:1},{type:'bomber',w:1}], interval:0.45, maxEnemies:40, diff:2.6 },
  { duration: 40, pool:[{type:'demon',w:2},{type:'slime',w:2},{type:'bomber',w:1}],     interval:0.4, maxEnemies:45, diff:3.0 },
  { duration: 60, pool:[{type:'demon',w:2},{type:'ghost',w:2},{type:'archer',w:1},{type:'bomber',w:2}], interval:0.35, maxEnemies:50, diff:3.5 },
];
const Spawner = function() {
  this.waveIndex = 0;
  this.waveTimer = 0;
  this.spawnTimer = 0;
  this.totalGameTime = 0;
  this.difficultyScale = 1;
  this.bossSpawned = false;
};
Spawner.prototype.getCurrentWave = function() {
  if (this.waveIndex >= WAVES.length) return WAVES[WAVES.length-1];
  return WAVES[this.waveIndex];
};
Spawner.prototype.update = function(dt, player, em) {
  this.totalGameTime += dt;
  this.waveTimer += dt;
  var wave = this.getCurrentWave();
  this.difficultyScale = wave.diff;
  // 波次切换
  if (this.waveTimer >= wave.duration) {
    this.waveTimer -= wave.duration;
    this.waveIndex++;
    wave = this.getCurrentWave();
  }
  // 生成敌人
  this.spawnTimer += dt;
  if (this.spawnTimer >= wave.interval) {
    this.spawnTimer -= wave.interval;
    this._spawn(player, em, wave);
  }
  // BOSS：第5波和第10波出现
  if ((this.waveIndex === 4 || this.waveIndex === 9) && !this.bossSpawned && this.waveTimer > 5) {
    this.bossSpawned = true;
    this._spawnBoss(player, em);
  }
  if (this.waveIndex !== 4 && this.waveIndex !== 9) {
    this.bossSpawned = false;
  }
};
Spawner.prototype._spawn = function(player, em, wave) {
  var enemies = em.filter(Enemy);
  if (enemies.length >= wave.maxEnemies) return; // 同屏上限
  // 按权重选类型
  var totalW = 0;
  wave.pool.forEach(function(p){ totalW += p.w; });
  var roll = Math.random() * totalW;
  var typeName = wave.pool[0].type;
  for (var i=0; i<wave.pool.length; i++) {
    roll -= wave.pool[i].w;
    if (roll <= 0) { typeName = wave.pool[i].type; break; }
  }
  var pos = spawnPointAroundPlayer(player.x, player.y, 220, 320);
  em.add(new Enemy(pos.x, pos.y, typeName, this.difficultyScale));
};
Spawner.prototype._spawnBoss = function(player, em) {
  var pos = spawnPointAroundPlayer(player.x, player.y, 260, 340);
  em.add(new Enemy(pos.x, pos.y, 'boss', this.difficultyScale * 1.5));
};
Spawner.onEnemyDeath = function(enemy, em) {
  if (enemy.dead) em.remove(enemy);
  var type = ENEMY_TYPES[enemy.typeName];
  // 经验宝石
  var count = enemy.typeName === 'boss' ? 5 : (1 + Math.floor(Math.random()*2));
  for (var i=0; i<count; i++) {
    var ox = (Math.random()-0.5)*30, oy = (Math.random()-0.5)*30;
    em.add(new XpGem(enemy.x+ox, enemy.y+oy, type.xp));
  }
  // 回血道具掉落
  var potionType = rollHealthDrop(enemy.typeName);
  if (potionType) {
    em.add(new HealthPotion(enemy.x + (Math.random()-0.5)*20, enemy.y + (Math.random()-0.5)*20, potionType));
  }

  // ---- 史莱姆分裂：死亡生成 2-3 只小史莱姆 ----
  if (enemy.typeName === 'slime') {
    var splitCount = 2 + Math.floor(Math.random()*2); // 2或3
    for (var s=0; s<splitCount; s++) {
      var angle = (Math.PI*2/splitCount)*s + Math.random()*0.5;
      var sx = enemy.x + Math.cos(angle)*20;
      var sy = enemy.y + Math.sin(angle)*20;
      var small = new Enemy(sx, sy, 'slime_small', enemy.diffScale);
      small.pushVx = Math.cos(angle)*80;
      small.pushVy = Math.sin(angle)*80;
      em.add(small);
    }
  }

  // ---- 爆炸幽灵：死亡后 8 方向弹幕 ----
  if (enemy.typeName === 'bomber') {
    var bulletCount = 8;
    var bulletDamage = Math.floor(enemy.damage * 0.6);
    for (var b=0; b<bulletCount; b++) {
      var bAngle = (Math.PI*2/bulletCount)*b;
      var speed = 90 + Math.random()*40;
      em.add(new EnemyProjectile(enemy.x, enemy.y, {
        vx: Math.cos(bAngle)*speed,
        vy: Math.sin(bAngle)*speed,
        damage: bulletDamage,
        lifetime: 2.5,
        color: '#ff3333',
        type: 'death_orb',
        w: 10, h: 10,
      }));
    }
  }
};

const WeaponSystem = function(player) {
  this.player = player;
  this.slots = [];
  this._shieldZone = null;
  this._fireZone = null;
  this._axePhase = 0;
  this._passiveStacks = {};
};
WeaponSystem.prototype.addWeapon = function(weaponId, branch) {
  var w = WEAPONS.find(function(w2){ return w2.id===weaponId; });
  if (!w) return;
  var existing = this.slots.find(function(s){ return s.weapon.id===weaponId; });
  if (existing) {
    if (existing.level < w.maxLv) { existing.level++; return {upgraded:true, name:w.name, lv:existing.level}; }
    return {maxed:true, name:w.name};
  }
  this.slots.push({weapon:w, level:1, cooldownTimer:0, branch: branch || null});
  return {new:true, name:w.name, lv:1};
};
WeaponSystem.prototype.update = function(dt, em) {
  var enemies = em.filter(Enemy);
  var player = this.player;
  var self = this;
  this.slots.forEach(function(slot){
    var w = slot.weapon;
    if (w.isContinuous) { self._updateContinuous(w, slot.level, enemies, em); return; }
    if (w.update) w.update(dt);
    slot.cooldownTimer -= dt;
    var cdMul = player.cdReduce ? (1 - Math.min(player.cdReduce, 0.5)) : 1;
    if (slot.cooldownTimer <= 0) {
      slot.cooldownTimer = w.getCooldown(slot.level) * cdMul;
      if (w.id === 'wand') self._fireWand(w, slot.level, player, enemies, em, slot);
      if (w.id === 'axe') self._fireAxe(w, slot.level, player, em);
    }
  });
};
WeaponSystem.prototype._fireWand = function(w, level, player, enemies, em, slot) {
  var closest = null, minDist = Infinity;
  enemies.forEach(function(e){
    var d = Math.hypot(e.x-player.x, e.y-player.y);
    if (d < minDist) { minDist = d; closest = e; }
  });
  if (!closest) return;
  var angle = Math.atan2(closest.y-player.y, closest.x-player.x);
  var branch = slot ? slot.branch : null;
  var count = w.getCount(level, branch);
  var piercing = w.getPiercing(level, branch);
  var homing = w.getHoming(level, branch);
  var splitCount = w.getSplitCount(level, branch);
  var baseDamage = Math.floor(w.getDamage(level)*(player.damageMultiplier||1));
  var speedMul = player.projSpeedMulti || 1;
  for (var i=0; i<count; i++) {
    var offset = (i - (count-1)/2)*0.25;
    var proj = new Projectile(player.x, player.y, {
      dx:Math.cos(angle+offset), dy:Math.sin(angle+offset),
      damage: baseDamage,
      speed:260 * speedMul, lifetime:2, color:'#b388ff', type:'magic', w:12, h:12,
      piercing: piercing,
      homing: homing,
      onHitSplit: splitCount > 0 ? {
        count: splitCount,
        damage: Math.max(1, Math.floor(baseDamage * w.getSplitDamageRatio(level))),
        speed: 180,
        color: '#d1a3ff',
        w: 8, h: 8,
      } : null,
    });
    if (homing > 0) proj._target = closest;
    em.add(proj);
  }
};
WeaponSystem.prototype._fireAxe = function(w, level, player, em) {
  var count = w.getCount(level);
  this._axePhase = (this._axePhase||0) + 0.5;
  var speedMul = player.projSpeedMulti || 1;
  for (var i=0; i<count; i++) {
    var angle = (Math.PI*2/count)*i + (this._axePhase||0);
    em.add(new Projectile(player.x, player.y, {
      dx:Math.cos(angle), dy:Math.sin(angle),
      damage:Math.floor(w.getDamage(level)*(player.damageMultiplier||1)),
      speed:200 * speedMul, lifetime:1.5, color:'#ff6d00', type:'bullet', w:10, h:10, piercing:2,
    }));
  }
};
WeaponSystem.prototype._updateContinuous = function(weapon, level, enemies, em) {
  var self = this;
  if (weapon.id === 'shield') {
    if (!this._shieldZone || this._shieldZone.dead) {
      this._shieldZone = new DamageZone(this.player, {radius:weapon.getRadius(level), damage:0, damageInterval:0.3, lifetime:0, color:'#4895ef'});
      em.add(this._shieldZone);
    }
    this._shieldZone.radius = weapon.getRadius(level);
    enemies.forEach(function(e){
      if (!e.dead && self._shieldZone && self._shieldZone.tryDamageEnemy(e)) {
        var dmg = Math.floor(weapon.getDamage(level)*(self.player.damageMultiplier||1));
        var isCrit = self.player.critChance && Math.random() < self.player.critChance;
        if (isCrit) dmg = Math.floor(dmg * (self.player.critMulti || 2));
        e.takeDamage(dmg, self.player.x, self.player.y);
        spawnDamageNumber(e.x, e.y - e.h/2, dmg, isCrit);
        if (e.dead) { Spawner.onEnemyDeath(e, em); self.player.kills++; }
      }
    });
  }
  if (weapon.id === 'fire') {
    var dmgInterval = weapon.getDamageInterval ? weapon.getDamageInterval(level) : 0.3;
    if (!this._fireZone || this._fireZone.dead) {
      this._fireZone = new DamageZone(this.player, {radius:weapon.getRadius(level), damage:0, damageInterval:dmgInterval, lifetime:0, color:'#ff6d00'});
      em.add(this._fireZone);
    }
    this._fireZone.radius = weapon.getRadius(level);
    this._fireZone.damageInterval = dmgInterval;
    enemies.forEach(function(e){
      if (!e.dead && self._fireZone && self._fireZone.tryDamageEnemy(e)) {
        var dmg = Math.floor(weapon.getDamage(level)*(self.player.damageMultiplier||1));
        var isCrit = self.player.critChance && Math.random() < self.player.critChance;
        if (isCrit) dmg = Math.floor(dmg * (self.player.critMulti || 2));
        e.takeDamage(dmg, self.player.x, self.player.y);
        spawnDamageNumber(e.x, e.y - e.h/2, dmg, isCrit);
        if (e.dead) { Spawner.onEnemyDeath(e, em); self.player.kills++; }
      }
    });
  }
};
WeaponSystem.prototype.getUpgradeOptions = function(count) {
  count = count || 3;
  var options = [];
  var self = this;
  this.slots.forEach(function(slot){
    if (slot.level < slot.weapon.maxLv) {
      var w = slot.weapon;
      // 武器有分支配置且当前未选择分支 → 生成分支选择选项
      if (w.branches && slot.level === 2 && !slot.branch) {
        Object.keys(w.branches).forEach(function(branchId){
          var b = w.branches[branchId];
          options.push({type:'upgrade', weaponId:w.id, branch:branchId,
            name:b.name + ' · ' + (branchId==='power'?'力量':'智慧'),
            icon:b.icon, desc:b.desc, level:3});
        });
      } else if (w.branches && slot.branch) {
        // 已选分支 → 从武器配置读取升级信息
        var info = w.getUpgradeInfo(slot.level + 1, slot.branch);
        if (info) {
          options.push({type:'upgrade', weaponId:w.id, branch:slot.branch,
            name:info.name, icon:info.icon, desc:info.desc, level:slot.level+1});
        }
      } else {
        options.push({type:'upgrade', weaponId:w.id,
          name:w.name, icon:w.icon,
          desc:'Lv.'+slot.level+' → Lv.'+(slot.level+1), level:slot.level+1});
      }
    }
  });
  var owned = this.slots.map(function(s){ return s.weapon.id; });
  WEAPONS.filter(function(w){ return !owned.includes(w.id); }).forEach(function(w){
    options.push({type:'new', weaponId:w.id, name:w.name, icon:w.icon, desc:w.desc, level:1});
  });
  var passivePool = [
    {type:'passive', stat:'damage', name:'攻击强化', icon:'⚔️', desc:'伤害倍率 +20%', maxStack:99},
    {type:'passive', stat:'speed', name:'移动加速', icon:'👟', desc:'移动速度 +15%', maxStack:99},
    {type:'passive', stat:'maxHp', name:'生命上限', icon:'❤️', desc:'最大生命 +30', maxStack:99},
    {type:'passive', stat:'pickup', name:'拾取范围', icon:'🧲', desc:'拾取范围 +30%', maxStack:99},
    {type:'passive', stat:'crit', name:'暴击大师', icon:'🎯', desc:'暴击率 +10%（2倍伤害）', maxStack:5},
    {type:'passive', stat:'cdreduce', name:'冷却缩减', icon:'⏳', desc:'武器冷却 -8%', maxStack:5},
    {type:'passive', stat:'magnet', name:'经验磁铁', icon:'🧭', desc:'拾取范围 +25%', maxStack:5},
    {type:'passive', stat:'armor', name:'护甲强化', icon:'🛡️', desc:'护甲 +3', maxStack:5},
    {type:'passive', stat:'regen', name:'生命回复', icon:'💚', desc:'每秒回复 1 HP', maxStack:5},
    {type:'passive', stat:'projSpeed', name:'弹速强化', icon:'💨', desc:'弹丸速度 +15%', maxStack:5}
  ];
  // 被动叠加次数追踪
  if (!this._passiveStacks) this._passiveStacks = {};
  passivePool.forEach(function(p){
    var stack = self._passiveStacks[p.stat] || 0;
    if (stack < p.maxStack) {
      var desc = p.desc;
      if (stack > 0) desc += ' (已叠加' + stack + '次)';
      options.push({type:'passive', stat:p.stat, name:p.name, icon:p.icon, desc:desc, maxStack:p.maxStack});
    }
  });
  for (var i=options.length-1; i>0; i--) { var j=Math.floor(Math.random()*(i+1)); var tmp=options[i]; options[i]=options[j]; options[j]=tmp; }
  return options.slice(0, count);
};
WeaponSystem.prototype.applyUpgrade = function(option) {
  if (option.type==='upgrade') {
    var slot = this.slots.find(function(s){ return s.weapon.id===option.weaponId; });
    // 如果是分支选择（有 branch 字段且 slot 还没有分支）
    if (option.branch && slot && !slot.branch) {
      slot.branch = option.branch;
    }
    return this.addWeapon(option.weaponId);
  }
  if (option.type==='new') return this.addWeapon(option.weaponId);
  if (option.type==='passive') {
    if (!this._passiveStacks) this._passiveStacks = {};
    this._passiveStacks[option.stat] = (this._passiveStacks[option.stat] || 0) + 1;
    switch(option.stat){
      case 'damage': this.player.damageMultiplier += 0.2; break;
      case 'speed': this.player.speed *= 1.15; break;
      case 'maxHp': this.player.maxHp += 30; this.player.hp = Math.min(this.player.hp+30, this.player.maxHp); break;
      case 'pickup': this.player.pickupRange *= 1.3; break;
      case 'crit':
        if (!this.player.critChance) this.player.critChance = 0;
        this.player.critChance += 0.10;
        if (!this.player.critMulti) this.player.critMulti = 2;
        break;
      case 'cdreduce':
        if (!this.player.cdReduce) this.player.cdReduce = 0;
        this.player.cdReduce += 0.08;
        break;
      case 'magnet': this.player.pickupRange *= 1.25; break;
      case 'armor':
        if (!this.player.armor) this.player.armor = 0;
        this.player.armor += 3;
        break;
      case 'regen':
        if (!this.player.hpRegen) this.player.hpRegen = 0;
        this.player.hpRegen += 1;
        break;
      case 'projSpeed':
        if (!this.player.projSpeedMulti) this.player.projSpeedMulti = 1;
        this.player.projSpeedMulti *= 1.15;
        break;
    }
    return {passive:true, name:option.name};
  }
};

// ============ 游戏主逻辑 ============
var canvas, ctx, W, H;
var gameState = 'start';
var player, camera, em, spawner, weaponSystem;
var gameStartTime = 0, lastTime = 0, animFrameId = null;
var input = null;

function resize() {
  var stage = $('game-stage');
  canvas = $('game-canvas');
  if (!canvas || !stage) return;
  ctx = canvas.getContext('2d');
  var worldW = WORLD.halfW * 2;
  var worldH = WORLD.halfH * 2;
  var pad = 32;
  var scale = Math.min(
    (window.innerWidth - pad) / worldW,
    (window.innerHeight - pad) / worldH
  );
  var w = Math.max(320, Math.floor(worldW * scale));
  var h = Math.max(240, Math.floor(worldH * scale));
  stage.style.width = w + 'px';
  stage.style.height = h + 'px';
  W = canvas.width = w;
  H = canvas.height = h;
  if (camera) camera.resize(W, H);
}

function initGame() {
  em = new EntityManager();
  player = new Player(0, 0);
  camera = new Camera(W, H);
  spawner = new Spawner();
  weaponSystem = new WeaponSystem(player);
  input = new InputManager();

  em.add(player);
  weaponSystem.addWeapon('wand');

  gameState = 'playing';
  gameStartTime = performance.now();

  $('start-screen').classList.add('hidden');
  $('gameover-screen').classList.add('hidden');
  $('level-up-screen').classList.remove('active');

  if (animFrameId) cancelAnimationFrame(animFrameId);
  lastTime = performance.now();
  animFrameId = requestAnimationFrame(gameLoop);
}

function gameLoop(timestamp) {
  if (!lastTime) lastTime = timestamp;
  var dt = Math.min((timestamp - lastTime)/1000, 0.05);
  lastTime = timestamp;

  if (gameState === 'playing') {
    update(dt);
    render();
  }

  animFrameId = requestAnimationFrame(gameLoop);
}

function update(dt) {
  var moveDir = input.getMoveDir();
  player.update(dt, moveDir);
  camera.follow(player);
  spawner.update(dt, player, em);
  weaponSystem.update(dt, em);

  var enemies = em.filter(Enemy);

  // 敌人更新（传入敌人列表用于推开）
  enemies.forEach(function(enemy){
    if (!enemy.dead) enemy.update(dt, player.x, player.y, enemies, em);
  });

  // 追踪弹目标刷新：每0.3秒重新锁定最近敌人
  em.entities.forEach(function(e){
    if (e instanceof Projectile && e.homing > 0 && !e.dead) {
      if (!e._target || e._target.dead || !e._homingTimer || e._homingTimer <= 0) {
        var closest = null, minDist = Infinity;
        enemies.forEach(function(en){
          if (en.dead) return;
          var d = Math.hypot(en.x-e.x, en.y-e.y);
          if (d < minDist) { minDist = d; closest = en; }
        });
        if (closest) e._target = closest;
        e._homingTimer = 0.3;
      }
      e._homingTimer -= dt;
    }
  });

  // 弓骷髅：射箭逻辑
  enemies.forEach(function(enemy){
    if (enemy.dead || enemy.typeName !== 'archer') return;
    if (enemy.shootTimer <= 0) {
      enemy.shootTimer = 2.2 + Math.random() * 0.8;
      var dx = player.x - enemy.x, dy = player.y - enemy.y;
      var dist = Math.sqrt(dx*dx+dy*dy);
      if (dist > 0) {
        var spd = 220;
        em.add(new EnemyProjectile(enemy.x, enemy.y, {
          vx: (dx/dist)*spd,
          vy: (dy/dist)*spd,
          damage: enemy.damage,
          lifetime: 3.0,
          color: '#ff3333',
          type: 'arrow',
          w: 10, h: 10,
        }));
      }
    }
  });

  // 爆炸幽灵：接触玩家时引爆（范围伤害）
  enemies.forEach(function(enemy){
    if (enemy.dead || enemy.typeName !== 'bomber') return;
    var dx = player.x - enemy.x, dy = player.y - enemy.y;
    var dist = Math.sqrt(dx*dx+dy*dy);
    if (dist < enemy.explodeRange * 0.5) {
      // 触发爆炸
      if (enemy.canAttack()) {
        enemy.onAttack();
        // 爆炸本体伤害
        player.takeDamage(enemy.damage);
        spawnDamageNumber(player.x, player.y-20, enemy.damage);
        // 强制死亡（引爆）
        enemy.dead = true;
        Spawner.onEnemyDeath(enemy, em);
        player.kills++;
      }
    }
  });

  // 投射物 vs 敌人
  var projectiles = em.filter(Projectile);
  projectiles.forEach(function(proj){
    enemies.forEach(function(enemy){
      if (proj.dead || enemy.dead) return;
      if (proj.overlaps(enemy)) {
        if (proj.hitEnemy(enemy)) {
          var dmg = Math.floor(proj.damage * (player.damageMultiplier||1));
          // 暴击判定
          var isCrit = player.critChance && Math.random() < player.critChance;
          if (isCrit) dmg = Math.floor(dmg * (player.critMulti || 2));
          var died = enemy.takeDamage(dmg, proj.x, proj.y);
          if (died) { Spawner.onEnemyDeath(enemy, em); player.kills++; }
          spawnDamageNumber(enemy.x, enemy.y - enemy.h/2, dmg, isCrit);
          // 分裂碎片（裂空弹）
          if (proj.onHitSplit) {
            var sc = proj.onHitSplit;
            for (var si=0; si<sc.count; si++) {
              var sa = (Math.PI*2/sc.count)*si + Math.random()*0.5;
              em.add(new Projectile(proj.x, proj.y, {
                dx:Math.cos(sa), dy:Math.sin(sa),
                damage:sc.damage, speed:sc.speed, lifetime:1.0,
                color:sc.color, type:'magic', w:sc.w, h:sc.h, piercing:1,
              }));
            }
          }
        }
      }
    });
  });

  // 敌方弹丸 vs 玩家
  var enemyProjs = em.filter(EnemyProjectile);
  enemyProjs.forEach(function(ep){
    ep.update(dt);
    if (!ep.dead && !ep.hasHit && ep.overlaps(player)) {
      ep.hasHit = true;
      ep.dead = true;
      player.takeDamage(ep.damage);
      spawnDamageNumber(player.x, player.y-20, ep.damage);
    }
  });

  // 敌人 vs 玩家（带攻击冷却，bomber 除外已在上面处理）
  enemies.forEach(function(enemy){
    if (enemy.dead || enemy.typeName === 'bomber') return;
    if (enemy.overlaps(player)) {
      if (enemy.canAttack()) {
        enemy.onAttack();
        var dmgAmount = enemy.damage;
        // 幽灵隐身状态下伤害减半
        if (enemy.typeName === 'ghost' && enemy.phaseAlpha < 0.5) {
          dmgAmount = Math.max(1, Math.floor(dmgAmount * 0.5));
        }
        player.takeDamage(dmgAmount);
        spawnDamageNumber(player.x, player.y-20, dmgAmount);
        // 僵尸攻击附带减速效果
        if (enemy.typeName === 'zombie') {
          player.slowTimer = (enemy.slowOnHit || 0.6);
        }
      }
    }
  });

  // 经验宝石
  var gems = em.filter(XpGem);
  gems.forEach(function(gem){
    var val = gem.update(dt, player.x, player.y, player.pickupRange);
    if (val > 0) {
      if (player.addXp(val)) showLevelUpScreen();
    }
  });

  // 回血道具拾取
  var potions = em.filter(HealthPotion);
  potions.forEach(function(pot){
    var typeName = pot.update(dt, player.x, player.y, player.pickupRange + 30);
    if (typeName) {
      var healAmount = pot.heal;
      if (healAmount === 0) {
        healAmount = Math.floor(player.maxHp * 0.5);
      }
      player.hp = Math.min(player.maxHp, player.hp + healAmount);
      spawnHealNumber(player.x, player.y - 20, healAmount, typeName);
    }
  });

  em.update(dt);

  if (player.dead) { gameState = 'gameover'; showGameOver(); }

  updateHUD();
}

function render() {
  // 清空画布
  ctx.fillStyle = '#0d1b2a';
  ctx.fillRect(0, 0, W, H);

  // 绘制网格
  ctx.strokeStyle = '#1b2a4a';
  ctx.lineWidth = 1;
  var gridSize = 64;
  var startX = -(camera.x % gridSize);
  var startY = -(camera.y % gridSize);
  for (var x = startX; x < W; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (var y = startY; y < H; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 竞技场边界
  var arenaLeft = -WORLD.halfW - camera.x;
  var arenaTop = -WORLD.halfH - camera.y;
  var arenaW = WORLD.halfW * 2;
  var arenaH = WORLD.halfH * 2;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(0, 0, W, Math.max(0, arenaTop));
  ctx.fillRect(0, arenaTop + arenaH, W, Math.max(0, H - (arenaTop + arenaH)));
  ctx.fillRect(0, Math.max(0, arenaTop), Math.max(0, arenaLeft), arenaH);
  ctx.fillRect(arenaLeft + arenaW, Math.max(0, arenaTop), Math.max(0, W - (arenaLeft + arenaW)), arenaH);
  ctx.strokeStyle = '#4895ef';
  ctx.lineWidth = 3;
  ctx.strokeRect(arenaLeft, arenaTop, arenaW, arenaH);

  // 渲染所有实体
  em.render(ctx, camera);

  // 渲染玩家（确保在最上层）
  if (player && !player.dead) player.render(ctx, camera);
}

function updateHUD() {
  if (!player) return;
  $('hp-bar-inner').style.width = Math.max(0, (player.hp/player.maxHp)*100) + '%';
  $('xp-bar-inner').style.width = (player.xp/player.xpToNext*100) + '%';
  $('level-text').textContent = 'LV ' + player.level;
  var elapsed = (performance.now()-gameStartTime)/1000;
  var min = Math.floor(elapsed/60).toString().padStart(2,'0');
  var sec = Math.floor(elapsed%60).toString().padStart(2,'0');
  $('timer').textContent = min + ':' + sec;
  $('kill-count').textContent = 'Kills: ' + player.kills;
  if (spawner) {
    var wave = spawner.getCurrentWave();
    var waveNum = Math.min(spawner.waveIndex + 1, WAVES.length);
    var waveSec = Math.floor(spawner.waveTimer);
    var waveDur = Math.floor(wave.duration);
    $('wave-info').textContent = 'Wave ' + waveNum + ' (' + waveSec + '/' + waveDur + 's)';
  }
}

function showLevelUpScreen() {
  gameState = 'levelup';
  var screen = $('level-up-screen');
  var optionsDiv = $('level-up-options');
  var title = $('level-up-title');
  var subtitle = $('level-up-subtitle');
  optionsDiv.innerHTML = '';
  title.className = '';
  subtitle.style.display = 'none';
  var options = weaponSystem.getUpgradeOptions(3);
  // 检测是否包含分支选择（upgrade 类型但有 branch 字段）
  var hasBranch = options.some(function(o){ return o.type === 'upgrade' && o.branch; });
  if (hasBranch) {
    title.textContent = '选择你的道路';
    title.className = 'branch-select';
    subtitle.textContent = '魔法杖将获得独特的进化路线，此选择不可更改';
    subtitle.style.display = 'block';
  } else {
    title.textContent = 'LEVEL UP';
  }
  options.forEach(function(opt){
    var card = document.createElement('div');
    // 只有魔法杖 Lv.3 且未选分支时，显示分支选择按钮
    var slot = weaponSystem.slots.find(function(s){ return s.weapon.id === opt.weaponId; });
    var needBranchSelect = (opt.type === 'upgrade' && opt.branch && slot && !slot.branch);
    if (needBranchSelect) {
      card.className = 'upgrade-card branch-select-card';
      var w = WEAPONS.find(function(w2){ return w2.id === opt.weaponId; });
      var branches = w ? w.branches : {};
      var powerBtn = '';
      var wisdomBtn = '';
      if (branches.power) {
        powerBtn = '<button class="branch-btn branch-power-btn" data-branch="power">' +
          '<span class="branch-btn-icon">' + branches.power.icon + '</span>' +
          '<span class="branch-btn-name">力量</span>' +
          '<span class="branch-btn-desc">' + branches.power.desc + '</span>' +
          '</button>';
      }
      if (branches.wisdom) {
        wisdomBtn = '<button class="branch-btn branch-wisdom-btn" data-branch="wisdom">' +
          '<span class="branch-btn-icon">' + branches.wisdom.icon + '</span>' +
          '<span class="branch-btn-name">智慧</span>' +
          '<span class="branch-btn-desc">' + branches.wisdom.desc + '</span>' +
          '</button>';
      }
      card.innerHTML = '<div class="card-icon">🪄</div>' +
        '<div class="card-name">魔法杖 Lv.3</div>' +
        '<div class="card-desc">选择进化方向</div>' +
        '<div class="branch-buttons">' + powerBtn + wisdomBtn + '</div>';
      var btns = card.querySelectorAll('.branch-btn');
      btns.forEach(function(btn){
        btn.onclick = function(e){
          e.stopPropagation();
          var branch = btn.getAttribute('data-branch');
          weaponSystem.applyUpgrade({type:'upgrade', weaponId:opt.weaponId, branch:branch});
          gameState='playing';
          screen.classList.remove('active');
        };
      });
    } else {
      // 普通升级卡牌（已选分支的后续升级，或其他武器/被动）
      card.className = 'upgrade-card';
      // 已选分支的魔法杖，用分支主题色
      if (slot && slot.branch) {
        card.classList.add('branch-' + slot.branch);
      }
      card.innerHTML = '<div class="card-icon">'+opt.icon+'</div><div class="card-name">'+opt.name+'</div><div class="card-desc">'+opt.desc+'</div><div class="card-level">'+(opt.level?'Lv.'+opt.level:'')+'</div>';
      card.onclick = function(){ weaponSystem.applyUpgrade(opt); gameState='playing'; screen.classList.remove('active'); };
    }
    optionsDiv.appendChild(card);
  });
  screen.classList.add('active');
}

function showGameOver() {
  var screen = $('gameover-screen');
  screen.classList.remove('hidden');
  var elapsed = (performance.now()-gameStartTime)/1000;
  var min = Math.floor(elapsed/60), sec = Math.floor(elapsed%60);
  $('go-title').textContent = '你倒下了';
  $('go-subtitle').textContent = '存活了 '+min+' 分 '+sec+' 秒';
  $('go-stats').innerHTML = '等级: <span>'+player.level+'</span><br>击杀: <span>'+player.kills+'</span><br>经验: <span>'+player.xp+'</span>';
}

function spawnDamageNumber(x, y, amount, isCrit) {
  var el = document.createElement('div');
  el.className = 'dmg-number';
  el.textContent = '-'+amount;
  el.style.left = (x-camera.x+Math.random()*30-15)+'px';
  el.style.top = (y-camera.y-20)+'px';
  if (isCrit) {
    el.style.color = '#ffd60a';
    el.style.fontSize = '20px';
    el.style.textShadow = '0 0 6px rgba(255,214,10,0.8)';
  } else {
    el.style.color = '#ff6b6b';
  }
  $('ui-overlay').appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 800);
}

function spawnHealNumber(x, y, amount, typeName) {
  var el = document.createElement('div');
  el.className = 'dmg-number';
  var prefix = typeName === 'chicken' ? '🐔 +' : '+';
  el.textContent = prefix + amount;
  el.style.left = (x-camera.x+Math.random()*20-10)+'px';
  el.style.top = (y-camera.y-20)+'px';
  el.style.color = '#4ade80';
  el.style.fontSize = '16px';
  $('ui-overlay').appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1000);
}

// ============ 全局 Game 对象 ============
window.Game = { start: initGame };

// ============ 启动 ============
function startup() {
  resize();
  $('start-screen').classList.remove('hidden');
  $('gameover-screen').classList.add('hidden');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', startup);
} else {
  startup();
}

window.addEventListener('resize', resize);
</script>
</body>
