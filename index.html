<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dark Survivors - 黑夜幸存者</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #0a0a0f; overflow: hidden; font-family: 'Segoe UI', sans-serif;
    display: flex; justify-content: center; align-items: center;
  }
  #game-stage {
    position: relative; flex-shrink: 0;
    box-shadow: 0 8px 48px rgba(0, 0, 0, 0.55);
    border-radius: 4px; overflow: hidden;
    border: 1px solid #243b55;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #ui-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #hud {
    position: absolute; top: 12px; left: 12px; color: #fff;
    font-size: 14px; line-height: 1.6; text-shadow: 1px 1px 2px #000;
  }
  #hp-bar-outer {
    width: 200px; height: 10px; background: #333; border-radius: 5px;
    overflow: hidden; margin-top: 4px;
  }
  #hp-bar-inner { width: 100%; height: 100%; background: #e63946; border-radius: 5px; transition: width 0.15s; }
  #xp-bar-outer {
    width: 100%; height: 8px; background: #222; border-radius: 4px;
    margin-top: 8px; position: relative;
  }
  #xp-bar-inner { width: 0%; height: 100%; background: #4895ef; border-radius: 4px; transition: width 0.15s; }
  #timer {
    position: absolute; top: 12px; right: 16px; color: #ffd60a;
    font-size: 18px; font-weight: bold; text-shadow: 1px 1px 3px #000;
  }
  #level-badge {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    color: #ffd60a; font-size: 16px; font-weight: bold;
    text-shadow: 1px 1px 3px #000;
  }
  #kill-count {
    position: absolute; top: 36px; right: 16px; color: #aaa;
    font-size: 13px; text-shadow: 1px 1px 2px #000;
  }
  /* Level Up Screen */
  #level-up-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.75); display: none; pointer-events: auto;
    justify-content: center; align-items: center; flex-direction: column;
  }
  #level-up-screen.active { display: flex; }
  #level-up-title { color: #ffd60a; font-size: 28px; font-weight: bold; margin-bottom: 24px; }
  #level-up-options { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; max-width: 700px; }
  .upgrade-card {
    width: 200px; padding: 16px; background: #1a1a2e; border: 2px solid #333;
    border-radius: 8px; cursor: pointer; text-align: center; color: #fff;
    transition: border-color 0.2s, transform 0.2s; pointer-events: auto;
  }
  .upgrade-card:hover { border-color: #ffd60a; transform: translateY(-4px); }
  .upgrade-card .card-icon { font-size: 36px; margin-bottom: 8px; }
  .upgrade-card .card-name { font-size: 16px; font-weight: bold; color: #4895ef; margin-bottom: 6px; }
  .upgrade-card .card-desc { font-size: 12px; color: #aaa; line-height: 1.4; }
  .upgrade-card .card-level { font-size: 11px; color: #666; margin-top: 6px; }
  /* Start / Game Over */
  #start-screen, #gameover-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.9); display: flex; justify-content: center;
    align-items: center; flex-direction: column; pointer-events: auto;
  }
  #start-screen.hidden, #gameover-screen.hidden { display: none; }
  .screen-title { color: #e63946; font-size: 36px; font-weight: bold; margin-bottom: 12px; text-shadow: 0 0 20px rgba(230,57,70,0.5); }
  .screen-subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
  .screen-btn {
    padding: 12px 36px; background: #e63946; color: #fff; border: none;
    font-size: 16px; border-radius: 6px; cursor: pointer;
    transition: background 0.2s, transform 0.2s; pointer-events: auto;
  }
  .screen-btn:hover { background: #ff4d5a; transform: scale(1.05); }
  .screen-stats { color: #aaa; font-size: 13px; margin-top: 20px; line-height: 1.8; text-align: center; }
  .screen-stats span { color: #ffd60a; font-weight: bold; }
  /* Damage Numbers */
  .dmg-number {
    position: absolute; color: #fff; font-size: 14px; font-weight: bold;
    pointer-events: none; text-shadow: 1px 1px 2px #000;
    animation: dmgFloat 0.8s ease-out forwards;
  }
  @keyframes dmgFloat {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-40px); }
  }
</style>
</head>
<body>
<div id="game-stage">
<canvas id="game-canvas"></canvas>
<div id="ui-overlay">
  <div id="hud">
    <div id="hp-bar-outer"><div id="hp-bar-inner"></div></div>
    <div id="xp-bar-outer"><div id="xp-bar-inner"></div></div>
    <div id="level-text" style="margin-top:4px;color:#888;font-size:12px;">LV 1</div>
  </div>
  <div id="timer">00:00</div>
  <div id="level-badge"></div>
  <div id="kill-count">Kills: 0</div>

  <div id="level-up-screen">
    <div id="level-up-title">LEVEL UP</div>
    <div id="level-up-options"></div>
  </div>

  <div id="start-screen">
    <div class="screen-title">DARK SURVIVORS</div>
    <div class="screen-subtitle">活下去，直到黎明</div>
    <div style="color:#666;font-size:12px;margin-bottom:24px;line-height:1.8;text-align:center;">
      WASD / 方向键 移动 | 武器自动攻击<br>
      收集经验宝石升级 | 选择强化能力<br>
      存活 5 分钟即可获胜
    </div>
    <button class="screen-btn" onclick="Game.start()">开始游戏</button>
  </div>

  <div id="gameover-screen" class="hidden">
    <div class="screen-title" id="go-title">你倒下了</div>
    <div class="screen-subtitle" id="go-subtitle"></div>
    <div class="screen-stats" id="go-stats"></div>
    <button class="screen-btn" onclick="Game.start()" style="margin-top:16px;">再来一局</button>
  </div>
</div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
